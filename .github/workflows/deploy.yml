name: Deploy to Xserver

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
    - name: Deploy to Xserver via FTP
      uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # 通信を暗号化する（FTPS）。暗号化なしの FTP ではパスワードと中身がそのまま流れるため（2026-11-08）
        protocol: ftps
        local-dir: ./
        server-dir: aquabit-lab.com/public_html/
        # 公開リポジトリの Actions ログにサーバーのファイル一覧を出さない
        log-level: standard
        timeout: 600000
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/.claude/**
          **/src/**
          **/_dev/**
          **/AGENTS.md
          **/CLAUDE.md
          **/.server.pid
          **/tools/**
          **/package.json
          **/package-lock.json
          **/_preview_test.html
          **/.DS_Store
          **/README.md
          **/README-DEV.md
          **/pamphlet-print-instructions.md
          **/ai-salon-pamphlet.html
          **/ai-salon/img/**
          **/.github/**
          **/htaccess-backup.txt
          **/server.py
          **/dev.sh
          **/about.php
          **/ai-service.php
          **/contact.php
          **/education.php
          **/front.php
          **/marine.php
          **/privacy-policy.php
          **/web3.php
